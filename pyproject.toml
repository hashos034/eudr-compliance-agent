[project]
name = "eudr"
version = "0.1.0"
description = "Checks coffee supplier data against the EU Deforestation Regulation and drafts a due diligence statement"
readme = "README.md"
authors = [
    { name = "hashos034", email = "153015409+hashos034@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.177",
    "en-core-web-md",
    "fastapi>=0.162.6",
    "fastmcp>=4.1.4",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pydantic>=2.14.1",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
eudr = "eudr:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "rasterio>=1.5.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
